default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.6.0
    hooks:
      - id: commitizen
        name: Check commit message
        stages:
          - commit-msg
  - repo: local
    hooks:
      # The published hooks pin their own tools, which dependabot does not
      # bump with the project's. The two then disagree and `make check`
      # passes while CI fails on the same files. Run the one we depend on.
      - id: uv-lock
        name: Update lockfile
        entry: uv lock
        language: system
        files: ^(uv\.lock|uv\.toml|pyproject\.toml)$
        pass_filenames: false
      - id: ruff
        name: Lint code
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Format code
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: Type check
        entry: uv run --no-sync ty check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
        name: Check valid Python AST
      - id: check-yaml
        name: Check valid YAML files
        args: [--allow-multiple-documents]
      - id: check-json
        name: Check valid JSON files
      - id: pretty-format-json
        name: Pretty-format JSON files
        args: [--autofix, --no-ensure-ascii, --no-sort-keys]
      - id: check-toml
        name: Check valid TOML files
      - id: check-added-large-files
        name: Check for large files
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: trailing-whitespace
        name: Remove trailing whitespace
      - id: end-of-file-fixer
        name: Fix end-of-file newline
  - repo: local
    hooks:
      - id: pytest
        name: Run tests
        entry: uv run --no-sync coverage run
        language: system
        pass_filenames: false
        stages:
          - pre-push
      - id: coverage
        name: Report coverage
        entry: uv run --no-sync coverage report
        language: system
        pass_filenames: false
        stages:
          - pre-push
