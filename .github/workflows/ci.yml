name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "NOTICE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "NOTICE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run coverage run

      - name: Coverage
        run: uv run coverage report

  # Builds WITHOUT the database: `make data` needs the CEP Aberto credentials
  # and several minutes, and the ODbL dumps must not land in a PR artifact.
  # `artifacts` is a no-op when the .sqlite is absent, so this checks the
  # packaging metadata only. The release job builds the real, populated wheel
  # and refuses to publish a DB-less one.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: build
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*.whl dist/*.tar.gz
